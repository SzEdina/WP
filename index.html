<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-header">
    <div class="avatar">💬</div>
    <div>
        <h1>Chat Room</h1>
        <p>Welcome! Type a message below.</p>
    </div>
</div>
<div class="username-bar">
    <label for="usernameInput">Your name:</label>
    <input type="text" id="usernameInput" placeholder="Enter your name" maxlength="50">
</div>
<div id="chat-box"></div>
<div id="statusMsg"></div>
<div class="chat-input-area">
    <input type="text" id="messageInput" placeholder="Type a message…" maxlength="500" autocomplete="off">
    <button id="sendBtn" title="Send">➤</button>
</div>

</div>
<script>
    'use strict';
    const chatBox= document.getElementById('chat-box');
    const messageInput = document.getElementById('messageInput');
    const usernameInput = document.getElementById('usernameInput');
    const sendBtn= document.getElementById('sendBtn');
    const statusMsg= document.getElementById('statusMsg');
    usernameInput.value = localStorage.getItem('chat_username') || '';
    usernameInput.addEventListener('input', () => {
        localStorage.setItem('chat_username', usernameInput.value.trim());
    });
    async function loadHistory() {
        try {
            const response = await fetch('history.php');
            const messages = await response.json();
            messages.forEach(msg => addMessageToChat(msg.username, msg.message, msg.sent_at));
            scrollToBottom();
        } catch (error) {
            showStatus('Could not load message history.');
            console.error('History error:', error);
        }
    }async function sendMessage() {
        const username = usernameInput.value.trim();
        const message  = messageInput.value.trim();
        if (username === '') {
            showStatus('Please enter your name first.');
            usernameInput.focus();
            return;
        }
        if (message === '') {
            showStatus('Please type a message.');
            return;
        }
        sendBtn.disabled = true;
        showStatus('');
        try {
            const response = await fetch('save.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, message: message })
            });
            const result = await response.json();
            if (!result.success) {
                throw new Error(result.message);
            }
            const now = new Date().toLocaleString();
            addMessageToChat(username, message, now);
            messageInput.value = '';
            scrollToBottom();
        }
        catch (error) {
            showStatus('Error: ' + error.message);
            console.error('Send error:', error);
        }
        finally {
            sendBtn.disabled = false;
            messageInput.focus();
        }
    }
    function addMessageToChat(username, message, sentAt) {

        const currentUser = usernameInput.value.trim();
        const isMine = username === currentUser && currentUser !== '';
        const div = document.createElement('div');
        div.className = 'message ' + (isMine ? 'mine' : 'other');
        const sender = document.createElement('span');
        sender.className = 'sender';
        sender.textContent = username;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = message;

        const time = document.createElement('span');
        time.className = 'timestamp';
        time.textContent = sentAt;
        div.appendChild(sender);
        div.appendChild(bubble);
        div.appendChild(time);
        chatBox.appendChild(div);
    }
    function scrollToBottom() {
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    function showStatus(text) {
        statusMsg.textContent = text;
    }
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    loadHistory();
</script>
</body>
</html>
